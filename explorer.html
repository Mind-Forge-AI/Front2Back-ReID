<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Front2Back-ReID Explorer</title><style>:root{font:16px/1.5 system-ui;color:#e6eaf0;background:#101720;color-scheme:dark}*{box-sizing:border-box}body{max-width:1400px;margin:auto;padding:32px 24px}header,footer{border-bottom:1px solid #364253;padding-bottom:20px;margin-bottom:24px}footer{border-bottom:0;border-top:1px solid #364253;margin-top:32px;padding-top:18px;color:#b7c3d4;font-size:14px}h1{margin:0;font-size:clamp(26px,4vw,44px)}p{color:#b7c3d4}a{color:#96daca}nav,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}button,select,input{font:inherit;padding:8px 12px;border:1px solid #4d617a;border-radius:5px;background:#1d2a39;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}input[type=number]{width:88px}input[type=range]{flex:1;min-width:150px;padding:0}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}figure{margin:0;background:#182330;border:1px solid #344457;border-radius:8px;overflow:hidden}figcaption{padding:12px 16px;font-weight:600}.image{aspect-ratio:16/9;background:#080d13}.image img{width:100%;height:100%;object-fit:contain}#details{padding:16px;background:#1c2938;border-radius:6px;margin-top:18px}#answer{color:#b5e7a6}#error{color:#ffb0aa;white-space:pre-wrap}@media(max-width:800px){.panels{grid-template-columns:1fr}body{padding:20px 14px}}</style><body><header><h1>Front2Back-ReID</h1><p>500 front-to-rear vehicle matching pairs · 844 original frames</p><nav><a href="index.html">Project page</a><a href="README.md">Dataset guide</a><a href="annotations/pairs.jsonl" download>Pair manifest</a><a href="annotations/ground_truth.jsonl" download>Ground truth</a></nav><p id="notice">Loading benchmark…</p></header><main><div class="controls"><button id="previous" disabled>← Previous</button><label>Pair <input id="number" type="number" min="1" max="500" value="1" disabled></label><button id="next" disabled>Next →</button><input id="slider" type="range" min="1" max="500" value="1" disabled></div><div class="controls"><label>Front view <select id="mode"><option value="marked">Target box</option><option value="original">Original frame</option><option value="crop">Target crop</option><option value="mask">Target mask</option></select></label><label><input id="rear-original" type="checkbox"> Original rear frame</label><label><input id="show-answer" type="checkbox"> Reveal correct match</label></div><p id="error" role="alert"></p><div class="panels"><figure><figcaption id="front-caption">Front query</figcaption><div class="image"><img id="front" alt="Front query vehicle"></div></figure><figure><figcaption id="rear-caption">Rear candidate gallery</figcaption><div class="image"><img id="rear" alt="Rear candidate gallery"></div></figure></div><div id="details"></div><p id="answer"></p></main><footer>Use the dataset guide for task instructions, scoring, validation, citation, and licensing information.</footer><script>const $=id=>document.getElementById(id);let pairs=[],answers=new Map(),current=0;async function get(u){const r=await fetch(u);if(!r.ok)throw Error(u+': HTTP '+r.status);return r.text()}function display(){const p=pairs[current],m=$('mode').value;if(!p)return;const front=m==='original'?p.front.image:m==='mask'?p.front.target_mask:m==='crop'?p.inputs.front_crop:p.inputs.front_marked;$('front').src=front;$('rear').src=$('rear-original').checked?p.rear.image:p.inputs.rear_marked;$('number').value=$('slider').value=current+1;$('previous').disabled=current===0;$('next').disabled=current===pairs.length-1;$('front-caption').textContent=p.pair_id+' · Front query';$('rear-caption').textContent='Rear gallery · '+p.rear.candidates.length+' candidates';$('details').textContent=[p.pair_id,p.road_context,p.time_of_day,p.weather].join(' · ').replaceAll('_',' ');$('answer').textContent=$('show-answer').checked?'Correct match: '+answers.get(p.pair_id).correct_candidate_id:'';location.hash=p.pair_id}function move(n){current=Math.max(0,Math.min(pairs.length-1,n));display()}$('previous').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('number').onchange=()=>move(+$('number').value-1);$('slider').oninput=()=>move(+$('slider').value-1);['mode','rear-original','show-answer'].forEach(i=>$(i).onchange=display);(async()=>{try{const[p,a]=await Promise.all([get('annotations/pairs.jsonl'),get('annotations/ground_truth.jsonl')]);pairs=p.trim().split('\n').map(JSON.parse);answers=new Map(a.trim().split('\n').map(JSON.parse).map(x=>[x.pair_id,x]));$('notice').textContent='500-pair benchmark release';['number','slider'].forEach(i=>$(i).disabled=false);const h=/^#P(\d{4})$/.exec(location.hash);move(h?+h[1]-1:0)}catch(e){$('error').textContent='Unable to load the benchmark. Serve this folder with python -m http.server 8000.\n'+e.message}})()</script></body></html>
